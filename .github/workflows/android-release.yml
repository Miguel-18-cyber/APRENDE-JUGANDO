name: Android Play Store bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Configure Play upload key
        env:
          ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = {
              "ANDROID_UPLOAD_KEY_BASE64": os.environ.get("ANDROID_UPLOAD_KEY_BASE64", ""),
              "ANDROID_UPLOAD_KEY_PASSWORD": os.environ.get("ANDROID_UPLOAD_KEY_PASSWORD", ""),
              "ANDROID_UPLOAD_KEY_ALIAS": os.environ.get("ANDROID_UPLOAD_KEY_ALIAS", ""),
              "ANDROID_UPLOAD_STORE_PASSWORD": os.environ.get("ANDROID_UPLOAD_STORE_PASSWORD", ""),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          android = Path("android")
          (android / "upload-keystore.jks").write_bytes(
              base64.b64decode(required["ANDROID_UPLOAD_KEY_BASE64"], validate=True)
          )
          (android / "key.properties").write_text(
              "\n".join([
                  "storePassword=" + required["ANDROID_UPLOAD_STORE_PASSWORD"],
                  "keyPassword=" + required["ANDROID_UPLOAD_KEY_PASSWORD"],
                  "keyAlias=" + required["ANDROID_UPLOAD_KEY_ALIAS"],
                  "storeFile=upload-keystore.jks",
                  "",
              ]),
              encoding="utf-8",
          )
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Save bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprende-jugando-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
